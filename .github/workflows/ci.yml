name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR so pushes during review
# don't queue up a backlog of stale jobs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test (real Postgres + Redis + Chromium)
    runs-on: ubuntu-latest

    # Real infrastructure, not mocks — this mirrors how the test suite is
    # actually written (see packages/database, packages/queue,
    # apps/api, apps/scanner-worker: every "integration" test connects to
    # a real service and is explicitly not skipped/mocked).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ui_quality_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Both naming conventions used across the test suite point at the
      # same service — see packages/database (TEST_DATABASE_URL),
      # apps/api and apps/scanner-worker (also TEST_DATABASE_URL, just
      # with a different default credential baked in when unset).
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ui_quality_test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ui_quality_test
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: ci-only-secret-do-not-use-in-prod
      STORAGE_SIGNING_SECRET: ci-only-secret-do-not-use-in-prod
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Cache the downloaded browser binary across runs — it's the
      # slowest single step otherwise (a full Chromium + system libs
      # download on every run).
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium (with system deps)
        run: npx playwright install --with-deps chromium
        # --with-deps still needs to run even on a cache hit, since the
        # apt-level system libraries aren't part of the cached path —
        # only re-download the browser binary itself is what the cache
        # actually saves.

      - name: Resolve installed Chromium path
        id: chromium
        # apps/scanner-worker's integration test is opt-in via
        # describe.skipIf(!process.env.UI_SCAN_CHROMIUM_PATH) — without
        # this it silently skips in CI instead of actually running.
        run: |
          PATH_OUT=$(node -e "console.log(require('playwright-core').chromium.executablePath())")
          echo "path=$PATH_OUT" >> "$GITHUB_OUTPUT"

      - name: Type-check & build all workspaces
        run: npm run build

      - name: "Run full test suite (184+ tests: unit + real DB/Redis/Chromium integration)"
        run: npm test
        env:
          UI_SCAN_CHROMIUM_PATH: ${{ steps.chromium.outputs.path }}

      # The backup/restore CLIs (packages/database/src/backup.ts,
      # restore.ts) shell out to the real `pg_dump`/`pg_restore`
      # binaries, which aren't available in every dev/sandbox
      # environment — this is the one place in the whole pipeline where
      # that's actually exercised for real, on every push, rather than
      # left as a documented-but-unverified claim.
      - name: Install postgresql-client (for pg_dump/pg_restore)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: "Smoke test: backup, wipe, restore, verify data survives"
        run: |
          set -e
          npm run migrate --workspace=@ui-quality/database

          psql "$DATABASE_URL" -c "INSERT INTO workspaces (id, name) VALUES ('11111111-1111-1111-1111-111111111111', 'backup-smoke-test-workspace');"

          BACKUP_STORAGE_ROOT_DIR=/tmp/backup-smoke-test npm run backup --workspace=@ui-quality/database

          psql "$DATABASE_URL" -c "TRUNCATE workspaces CASCADE;"
          COUNT_AFTER_WIPE=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM workspaces WHERE id = '11111111-1111-1111-1111-111111111111';")
          if [ "$COUNT_AFTER_WIPE" != "0" ]; then echo "expected 0 rows after TRUNCATE, got $COUNT_AFTER_WIPE"; exit 1; fi

          BACKUP_STORAGE_ROOT_DIR=/tmp/backup-smoke-test npm run restore --workspace=@ui-quality/database -- --yes

          COUNT_AFTER_RESTORE=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM workspaces WHERE id = '11111111-1111-1111-1111-111111111111';")
          if [ "$COUNT_AFTER_RESTORE" != "1" ]; then echo "expected the row back after restore, got count=$COUNT_AFTER_RESTORE"; exit 1; fi
          echo "Backup/restore smoke test passed: row survived a real pg_dump -> wipe -> pg_restore cycle."
